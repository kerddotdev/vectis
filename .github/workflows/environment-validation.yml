name: Vectis environment validation

on:
  push:
    branches: [vectis/environment-validation-20261010]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectis-environment-validation
  cancel-in-progress: false

jobs:
  ubuntu:
    name: Ubuntu checkout and build
    runs-on: vectis-ubuntu
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  ubuntu-container:
    name: Ubuntu container checkout
    needs: ubuntu
    runs-on: vectis-ubuntu
    timeout-minutes: 15
    container: ubuntu:24.04 # Ubuntu 24.04 LTS
    steps:
      - name: Verify container and workspace mount
        run: |
          test -f /.dockerenv
          cat /etc/os-release
          test -d "$GITHUB_WORKSPACE"
          grep -F ' /__w ' /proc/self/mountinfo
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify checkout in the mounted workspace
        run: |
          test -f "$GITHUB_WORKSPACE/package.json"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

  ubuntu-services:
    name: Ubuntu PostgreSQL service
    needs: ubuntu-container
    runs-on: vectis-ubuntu
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17 # PostgreSQL 17
        env:
          POSTGRES_PASSWORD: vectis-validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v pg_isready >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
      - name: Connect to PostgreSQL from the host runner
        env:
          PGPASSWORD: vectis-validation
          PGCONNECT_TIMEOUT: "10"
        run: |
          pg_isready -h localhost -p 5432 -U postgres -d postgres
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'select 1'

  macos:
    name: macOS Xcode and native app build
    needs: ubuntu-services
    runs-on: vectis-macos-26-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/validate-macos.sh

  windows:
    name: Windows ARM64 native and Electron builds
    needs: macos
    runs-on: vectis-windows-11-arm64
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          architecture: arm64
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Python, C++ ARM64 tools and Windows SDK
        run: ./.github/scripts/prepare-windows-tools.ps1
      - name: Verify Windows and compile and run ARM64 C++
        run: ./.github/scripts/validate-windows.ps1
      - run: pnpm install --frozen-lockfile
      - name: Package and verify a minimal ARM64 Electron app
        run: node .github/scripts/validate-electron.mjs
