name: Vectis environment validation

on:
  push:
    branches: [vectis/environment-validation-20261010]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectis-environment-validation
  cancel-in-progress: false

jobs:
  ubuntu:
    name: Ubuntu checkout and build
    runs-on: vectis-ubuntu
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  macos:
    name: macOS Xcode and native app build
    needs: ubuntu
    runs-on: vectis-macos-26-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/validate-macos.sh
