name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync
    runs-on: vectis-ubuntu
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = JSON.parse(require("node:fs").readFileSync(".github/labels.json", "utf8"));
            for (const label of labels) {
              try {
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }
